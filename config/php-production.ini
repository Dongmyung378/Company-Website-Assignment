; Load this project-specific sample with php -c /absolute/path/to/config/php-production.ini.
; Enable mysqli with the extension_dir and extension settings for your installation.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
zend.exception_ignore_args = On
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off
; This PERDIR setting must be disabled at startup, before request-body parsing.
; An ini_set() call in bootstrap.php would be too late and cannot change it.
session.upload_progress.enabled = Off
session.cookie_httponly = On
session.cookie_samesite = Lax
; HTTPS production deployments should also set session.cookie_secure = On.
; bootstrap.php enables Secure automatically when APP_ORIGIN starts with https://.
